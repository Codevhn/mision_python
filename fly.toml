# fly.toml app configuration file generated for mision-python-guurbw on 2026-08-02T01:58:45Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'mision-python-guurbw'
primary_region = 'ams'

[build]
  dockerfile = 'Dockerfile'

[[mounts]]
  source = 'kb_data'
  destination = '/data'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
