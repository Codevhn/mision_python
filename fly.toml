# fly.toml — app real: mision-pythonhn (la KB con los 1045 registros).
# NOTA: no cambiar el nombre de la app a mision-python-guurbw (duplicado vacío).

app = 'mision-pythonhn'
primary_region = 'lax'

[build]
  dockerfile = 'Dockerfile'

[[mounts]]
  source = 'kb_data'
  destination = '/data'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
