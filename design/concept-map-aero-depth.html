</style></head><body><header class="top"><div><div class="brand">✦ PROJECT ATLAS · CRISTAL AERO</div><h1>Explora hacia dentro.</h1><p>Navegación espacial continua y lectura digital suave.</p></div><a href="concept-map-proposals.html">Ver las propuestas</a></header><nav class="navigation" aria-label="Navegación del mapa"><button id="back" disabled>← Volver</button><button id="overview">Mapa completo</button><div class="trail" id="trail" aria-live="polite">Contenedor Padre CSS</div><button id="galaxyToggle" aria-pressed="true">Fondo galáctico</button><span class="depth-badge" id="depth">CAPA 01</span></nav><main class="world" id="world" aria-label="Mapa conceptual en profundidad"><div class="galaxy" aria-hidden="true"><div class="star-plane far"></div><div class="star-plane near"></div></div><div class="portal"></div><aside class="memory-deck" aria-label="Capas anteriores del mapa"></aside></main><footer>Prueba: Modelo de Caja → Margin → margin-left. El contenido es una muestra; no se consulta un LLM ni se modifica Atlas.</footer><script>
const tree={root:{name:'Contenedor Padre CSS',sub:'Cada concepto abre una capa de relaciones.',children:['box','grid']},box:{name:'Modelo de Caja',sub:'Un elemento combina contenido, relleno, borde y margen.',children:['content','padding','border','margin']},grid:{name:'Contexto de Formato Grid',sub:'Organiza el diseño en filas y columnas.',children:['columns','rows']},margin:{name:'Margin',sub:'Explora las propiedades de margen exterior.',children:['top','right','bottom','left']},content:{name:'Contenido',description:'Texto, imágenes y otros contenidos.'},padding:{name:'Padding',description:'Espacio entre el contenido y el borde.'},border:{name:'Border',description:'Borde alrededor del contenido y el relleno.'},columns:{name:'grid-template-columns',description:'Define las columnas explícitas de una rejilla.'},rows:{name:'grid-template-rows',description:'Define las filas explícitas de una rejilla.'},top:{name:'margin-top',description:'Margen exterior superior.'},right:{name:'margin-right',description:'Margen exterior derecho.'},bottom:{name:'margin-bottom',description:'Margen exterior inferior.'},left:{name:'margin-left',description:'Margen exterior izquierdo.'}};
const world=document.getElementById('world'),back=document.getElementById('back'),trail=document.getElementById('trail'),depth=document.getElementById('depth'),reduce=matchMedia('(prefers-reduced-motion: reduce)');let route=['root'],timers=[],transitionTimer=null,serial=0;
function cancelReveal(){timers.forEach(clearTimeout);timers=[]}function create(tag,cls,text){const el=document.createElement(tag);el.className=cls||'';if(text!==undefined)el.textContent=text;return el}
function paragraph(text){const el=create('section','chunk');el.append(create('p','',text));return el}
function explanation(id){const n=tree[id];if(id==='left')return [{title:'Qué es',text:'margin-left establece el margen exterior izquierdo de la caja de un elemento en CSS. Ese espacio queda fuera de su borde; no es relleno interior.'},{title:'Ejemplo',code:'.tarjeta {\n  margin-left: 24px;\n}',text:'En este ejemplo se declara un margen izquierdo de 24 píxeles. El efecto visual depende del contexto de diseño.',sample:true},{title:'Valores y matices',text:'Acepta longitudes, porcentajes y auto; también puede ser negativo. En el caso habitual, el porcentaje se calcula respecto al ancho del bloque contenedor. auto se resuelve según el contexto de diseño y no significa siempre «centrar».'},{title:'Cuándo elegir otra propiedad',text:'margin-left corresponde al lado físico izquierdo. Si buscas el margen de inicio según la dirección de escritura, considera margin-inline-start.'},{title:'Documentación',link:'https://developer.mozilla.org/es/docs/Web/CSS/margin-left'}];return [{title:'Qué es',text:n.description||n.sub},{title:'Cómo se relaciona',text:'Este concepto forma parte de '+tree[route.at(-2)||'root'].name+'. Aquí podrías leer una explicación guardada en Atlas y regresar al mapa sin perder el contexto.'},{title:'Contenido de demostración',text:'Esta ficha prueba la lectura progresiva. En Atlas, el contenido procedería de la entrada vinculada o de una explicación solicitada explícitamente.'}]}
function reader(id){const reading=create('article','reading'),head=create('div','reading-head'),status=create('div','reveal-status','Desplegando explicación…'),body=create('div','reading-body'),show=create('button','','Mostrar todo');status.setAttribute('role','status');status.setAttribute('aria-live','polite');head.append(create('span','','LECTURA DIGITAL · POR BLOQUES'),show);reading.append(head,body,status);explanation(id).forEach(data=>{const chunk=create('section','chunk');chunk.append(create('h3','',data.title));if(data.code){const pre=create('pre');pre.append(create('code','',data.code));chunk.append(pre)}if(data.text)chunk.append(create('p','',data.text));if(data.sample){const sample=create('div','sample');sample.setAttribute('aria-label','Ejemplo ilustrativo: margen de 24 píxeles a la izquierda de una tarjeta');const parent=create('div','parent');parent.append(create('div','space'),create('div','box','Tarjeta'));sample.append(parent);chunk.append(sample)}if(data.link){const a=create('a','','Consultar MDN: margin-left ↗');a.href=data.link;a.target='_blank';a.rel='noopener noreferrer';chunk.append(a)}body.append(chunk)});const chunks=[...body.children];function finish(){status.textContent='Explicación completa · puedes volver al mapa';status.classList.add('done');show.hidden=true}function revealAll(){cancelReveal();chunks.forEach(c=>{c.classList.add('visible');c.classList.remove('scanning')});finish()}show.addEventListener('click',revealAll);reading.start=()=>{if(reduce.matches){revealAll();return}chunks.forEach((c,i)=>timers.push(setTimeout(()=>{c.classList.add('visible','scanning');if(i===chunks.length-1){timers.push(setTimeout(finish,1100))}},200+i*1550)))};reading.finish=revealAll;return reading}
function build(id){const n=tree[id],scene=create('section','scene'),title=create('div','layer-title');scene.dataset.concept=id;title.append(create('small','',n.children?'RELACIONES DEL CONCEPTO':'EXPLICACIÓN DEL CONCEPTO'),create('h2','',n.name));if(n.children)title.append(create('p','',n.sub));scene.append(create('div','ambient'),title);if(n.children){const hub=create('div','hub');hub.append(create('small','','CONCEPTO ACTUAL'),create('strong','',n.name));scene.append(hub);const svg=document.createElementNS('http://www.w3.org/2000/svg','svg');svg.classList.add('stems');svg.setAttribute('viewBox','0 0 740 70');svg.setAttribute('aria-hidden','true');n.children.forEach((child,i)=>{const p=document.createElementNS(svg.namespaceURI,'path'),x=740*(i+.5)/n.children.length;p.setAttribute('d',`M370 0 C370 35 ${x} 25 ${x} 70`);svg.append(p)});scene.append(svg);const children=create('div','children');n.children.forEach(child=>{const button=create('button','concept');button.dataset.target=child;button.style.setProperty('--drift',(-n.children.indexOf(child)*1.5)+'s');button.append(create('span','tag',tree[child].children?'EXPLORAR RAMAS':'ABRIR EXPLICACIÓN'),create('strong','',tree[child].name),create('span','description',tree[child].description||tree[child].sub),create('span','enter','+'));button.addEventListener('click',()=>enter(child));children.append(button)});scene.append(children,create('p','scene-note','Pulsa un concepto para entrar en su capa. «Volver» te devuelve a este nivel.'))}else{const reading=reader(id);scene.append(reading);scene.reader=reading}return scene}
function spatialContext(){world.dataset.depth=String(route.length);const deck=world.querySelector('.memory-deck');deck.replaceChildren();if(route.length<2)return;deck.append(create('span','memory-caption','CAPAS RECORRIDAS'),create('div','memory-line'));route.slice(0,-1).forEach((id,i)=>{const n=tree[id],card=create('button','memory');card.style.setProperty('--memory-y',(70+i*145)+'px');card.append(create('small','','CAPA '+String(i+1).padStart(2,'0')),create('strong','',n.name),create('span','',(n.children||[]).map(child=>tree[child].name).join(' · ')));card.setAttribute('aria-label','Volver a '+n.name);card.addEventListener('click',()=>{route=route.slice(0,i+1);display('out')});deck.append(card)})}
function display(direction='in',initial=false){cancelReveal();clearTimeout(transitionTimer);serial++;const turn=serial;world.querySelectorAll('.scene:not(.current)').forEach(el=>el.remove());const old=world.querySelector('.current'),next=build(route.at(-1));if(old){old.classList.remove('current');old.inert=true;old.classList.add(direction==='out'?'retreating':'departing')}spatialContext();next.classList.add('current');if(!initial&&!reduce.matches)next.classList.add(direction==='out'?'returning':'arriving');world.append(next);requestAnimationFrame(()=>requestAnimationFrame(()=>next.classList.remove('arriving','returning')));back.disabled=route.length===1;trail.replaceChildren();route.forEach((id,i)=>{if(i)trail.append(document.createTextNode(' › '));trail.append(create(i===route.length-1?'strong':'span','',tree[id].name))});world.querySelector('.star-plane.far').style.setProperty('--travel',1+(route.length-1)*.04);world.querySelector('.star-plane.near').style.setProperty('--travel',1+(route.length-1)*.12);depth.textContent='CAPA '+String(route.length).padStart(2,'0');transitionTimer=setTimeout(()=>{if(turn!==serial)return;if(old)old.remove();next.reader?.start();if(!initial){next.querySelector('h2').tabIndex=-1;next.querySelector('h2').focus({preventScroll:true})}},initial||reduce.matches?0:1700)}
function enter(id){route.push(id);display('in')}back.addEventListener('click',()=>{if(route.length>1){route.pop();display('out')}});document.getElementById('overview').addEventListener('click',()=>{if(route.length>1){route=['root'];display('out')}});reduce.addEventListener('change',()=>{if(reduce.matches)world.querySelector('.current')?.reader?.finish()});let seed=741;function random(){seed=(seed*16807)%2147483647;return seed/2147483647}world.querySelectorAll('.star-plane').forEach((plane,i)=>{for(let j=0;j<(i?45:110);j++){const star=create('i','star');star.style.cssText=`left:${random()*100}%;top:${random()*100}%;--shine:${.2+random()*.6}`;plane.append(star)}});document.getElementById('galaxyToggle').addEventListener('click',e=>{const calm=world.classList.toggle('calm');e.currentTarget.setAttribute('aria-pressed',String(!calm));e.currentTarget.textContent=calm?'Activar galaxia':'Fondo galáctico'});display('in',true);
